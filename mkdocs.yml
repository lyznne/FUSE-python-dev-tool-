site_name: FUSE - Python Dev Tool
site_description: Live Python Dev Server + UI + Logs + Framework-aware CLI
site_url: https://fuse-dev-tool.github.io/fuse-docs/
site_author: lyznne

repo_url: https://github.com/fuse-dev-tool
repo_name: fuse-docs
edit_uri: edit/main/

site_dir: docs_site

theme:
  name: material
  language: en
  user_color_mode_toggle: true # Dark mode toggle

  favicon: assets/images/favicon.ico
  logo: assets/images/fuse-logo.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - navigation.footer
  palette:
      # Light mode (default)
      - scheme: default
        primary: green  # or "emerald" (Material v9+)
        accent: teal    # or "light green" for a brighter accent
        toggle:
          icon: material/weather-night
          name: Switch to dark mode

      # Dark mode (slate)
      - scheme: slate
        primary: green  # or "deep green"
        accent: teal    # or "lime" for contrast
        toggle:
          icon: material/weather-sunny
          name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true
      locale: en
  - awesome-pages
  - minify:
      minify_html: true
  - glightbox

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fuse-dev-tool/fuse-core
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/fuse-dev-tool
  generator: false

nav:
  - Home: index.md

  - Guides:
      - Installation: guides/installation.md
      - Getting Started: guides/getting-started.md
      - Framework Integration: guides/framework-integration.md
      - Deployment: guides/deployment.md
      - Troubleshooting: guides/troubleshooting.md

  - API Reference:
      - Core Engine: api/core.md
      - CLI: api/cli.md
      - Web Interface: api/web.md
      - Plugin System: api/plugins.md

  - Development:
      - Setup & Env: development/setup.md
      - Architecture: development/architecture.md
      - Testing Strategy: development/testing.md
      - Contributing: development/contributing.md

  - Examples:
      - Django App: examples/django-example.md
      - Flask API: examples/flask-example.md
      - FastAPI Service: examples/fastapi-example.md
      - Streamlit Dashboard: examples/streamlit-example.md
      - Multi-framework Stack: examples/multi-framework.md

  - License: license.md
  - Changelog: changelog.md
